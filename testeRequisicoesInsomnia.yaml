type: collection.insomnia.rest/5.0
schema_version: '5.1'
name: ERP - JamsHub API
meta:
  id: wrk_40b91de1c8c6455792d1b26ece5e64ce
  created: 1790129555061
  modified: 1790129555061
  description: 'API local do ERP. Configure o Base Environment com IDs reais e suas credenciais; os campos de senha permanecem vazios neste arquivo. Primeiro execute Obter CSRF, copie o token para csrf_token e depois Entrar. Mantenha cookies habilitados e obtenha novo CSRF após login/logout. As pastas de acesso incluem funcionários, convites, cargos, permissões, sessões, política e auditoria. Filtros opcionais ficam desativados até serem preenchidos. Datas audit_from/audit_to usam ISO 8601 com fuso, por exemplo 2026-10-29T00:00:00-03:00. access_link_token recebe somente o valor de token do link de convite/recuperação, sem a URL. Não há endpoint HTTP de bootstrap: a criação inicial é feita pelo terminal, conforme backend/README.md. Nenhuma requisição é executada automaticamente ao importar.'
collection:
- name: Acesso e sessões
  meta:
    id: fld_authentication_access_20261023
    description: 'Obtenha o CSRF, copie token em csrf_token e mantenha cookies. Após login/logout obtenha novo CSRF. Escritas sem sessão retornam 401; sem permissão/CSRF, 403. POST /user e escritas /permission retornam 405 para autenticados. Operadores de novos movimentos/saídas/recebimentos vêm da sessão; legado divergente retorna 400. Retry de recebimento aceita operador histórico ou omissão e exige purchases.receive. Não repetir gravações automaticamente.'
    sortKey: 0
  children:
  - url: '{{ _.base_url }}/auth/csrf'
    name: Obter CSRF
    meta:
      id: req_1b89132a1f5e4ebe9d04c59a7694a43b
      isPrivate: true
    method: GET
    settings:
      cookies:
        send: true
        store: true
  - url: '{{ _.base_url }}/auth/login'
    name: Entrar
    meta:
      id: req_ddc541d083424d36ad5549c3d83d5628
      isPrivate: true
    method: POST
    body:
      mimeType: application/json
      text: "{\n  \"email\": \"{{ _.login_email }}\",\n  \"password\": \"{{ _.login_password }}\"\n}"
    headers:
    - name: X-CSRF-TOKEN
      value: '{{ _.csrf_token }}'
    - name: Content-Type
      value: application/json
    settings:
      cookies:
        send: true
        store: true
  - url: '{{ _.base_url }}/auth/session'
    name: Consultar sessão
    meta:
      id: req_db7079931e964bad9eefbd5530f34f97
      isPrivate: true
    method: GET
    settings:
      cookies:
        send: true
        store: true
  - url: '{{ _.base_url }}/auth/sessions'
    name: Minhas sessões
    meta:
      id: req_7a7f2c040b144ac7b9dc610666a107e0
      isPrivate: true
    method: GET
    settings:
      cookies:
        send: true
        store: true
  - url: '{{ _.base_url }}/auth/sessionReplacement'
    name: Substituir sessão (409 após senha válida)
    meta:
      id: req_706f9d6d77be4bacab9e5ac44b3353c9
      isPrivate: true
    method: POST
    body:
      mimeType: application/json
      text: "{\n  \"challengeToken\": \"{{ _.challenge_token }}\",\n  \"sessionId\": \"{{ _.public_session_id }}\"\n}"
    headers:
    - name: X-CSRF-TOKEN
      value: '{{ _.csrf_token }}'
    - name: Content-Type
      value: application/json
    settings:
      cookies:
        send: true
        store: true
  - url: '{{ _.base_url }}/auth/activity'
    name: Sinal de atividade interativa
    meta:
      id: req_613e61b2cc404f5ba878d4cf076ea422
      isPrivate: true
    method: POST
    headers:
    - name: X-CSRF-TOKEN
      value: '{{ _.csrf_token }}'
    settings:
      cookies:
        send: true
        store: true
  - url: '{{ _.base_url }}/auth/logout'
    name: Sair
    meta:
      id: req_69b28d38cf5c4532aba28e85e6183a04
      isPrivate: true
    method: POST
