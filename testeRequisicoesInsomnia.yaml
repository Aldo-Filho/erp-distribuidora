          store: true
        rebuildPath: true
    - url: '{{ _.base_url }}/productSupplier'
      name: Vincular produto ao fornecedor
      meta:
        id: req_10a1282c36fd7d51b5acecb400000003
        created: 1791678654231
        modified: 1791678654231
        isPrivate: false
        description: Produto, fornecedor e custo são obrigatórios. O par produto/fornecedor é único. preferred assume false
          e active assume true quando omitidos. Copie o ID retornado para supplier_product_id.
        sortKey: 300
      method: POST
      body:
        mimeType: application/json
        text: "{\n  \"productId\": \"{{ _.product_id }}\",\n  \"supplierId\": \"{{ _.supplier_id }}\",\n  \"cost\": 42.5,\n\
          \  \"avgDeliveryDays\": 5,\n  \"supplierProductCode\": \"ABC-25\",\n  \"preferred\": true,\n  \"active\": true\n\
          }"
