  - url: '{{ _.base_url }}/security/audit/search'
    name: Auditoria
    meta:
      id: req_2994c9901f91434fbb543c25ab5d5cd8
      description: 'Exige security.audit.read. Retorna responsável/alvo com nomes históricos e IDs, ação, resultado, data e detalhes. Eventos antigos podem não ter nomes. actorName consulta o nome gravado no evento; action/outcome usam códigos internos. Ative somente os filtros desejados.'
