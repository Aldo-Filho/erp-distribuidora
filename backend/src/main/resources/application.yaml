server:
  port: 8080
  forward-headers-strategy: none
  servlet:
    session:
      timeout: 24h
      cookie:
        name: ERP_SESSION
        http-only: true
        secure: false
        same-site: lax
        path: /
spring:
  jackson:
    deserialization:
      accept-float-as-int: false
  datasource:
    url: jdbc:postgresql://localhost:5432/erp
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
  session:
    timeout: 24h
    jdbc:
      initialize-schema: never
      flush-mode: immediate
      save-mode: on-set-attribute
  mail:
    host: smtp.gmail.com
    port: 587
    username: aldinhuuu145@gmail.com
    password: "aslkrscvyictzqzd"
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.ssl.checkserveridentity: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
erp:
  auth:
    public-base-url: http://localhost:5173
    mail-from: aldinhuuu145@gmail.com
    bootstrap-enabled: false
    bootstrap-role-id:
    login-per-ip-per-minute: 60
    recovery-per-ip-per-hour: 30
    argon-concurrency: 2
    max-body-bytes: 16384
logging:
  level:
    root: INFO
    org.springframework.web: INFO
    org.hibernate.orm.jdbc.bind: OFF
