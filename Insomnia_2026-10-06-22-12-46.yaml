          modified: 1791678654231
          sortKey: 700
          description: "Cadastre antes o fornecedor e o produto. Configure supplier_id e product_id. Depois do POST, copie o ID do vínculo para supplier_product_id; ele é diferente de product_id."
        children:
          - url: "{{ _.base_url }}/productSupplier/search"
