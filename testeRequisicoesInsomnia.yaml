        modified: 1791678654231
        isPrivate: false
        description: Envie somente os campos desejados. Aceita productId, supplierId, cost, avgDeliveryDays, supplierProductCode,
          preferred e active; um novo par não pode duplicar um vínculo existente. false e zero são aplicados.
        sortKey: 400
      method: PATCH
      body:
        mimeType: application/json
        text: "{\n  \"cost\": 45,\n  \"avgDeliveryDays\": 7,\n  \"supplierProductCode\": \"ABC-25-ATUALIZADO\",\n  \"preferred\"\
          : false,\n  \"active\": true\n}"
      headers:
      - name: X-CSRF-TOKEN
        value: '{{ _.csrf_token }}'
      - name: Content-Type
        value: application/json
      settings:
