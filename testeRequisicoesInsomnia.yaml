- name: Produtos
  meta:
    id: fld_311795a145ef4310b6ba07b77b9d97e7
    created: 1788304060808
    modified: 1788304060808
    sortKey: 200
    description: Endpoints do módulo de Produtos (com.pi.erp.product). brandId é obrigatório no cadastro; categoryId é opcional.
