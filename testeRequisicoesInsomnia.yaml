    - name: outcome
      value: '{{ _.audit_outcome }}'
      disabled: true
    settings:
      cookies:
        send: true
        store: true
  - url: '{{ _.base_url }}/auth/password'
    name: 'Alterar minha senha'
    meta:
      id: req_9dee9937dea74ed4bcad41b5753a5cb1
      isPrivate: true
      description: 'Sessão própria e CSRF. Nova senha: 15 a 128 caracteres. Encerra todas as sessões; entre novamente e renove o CSRF.'
    method: PATCH
