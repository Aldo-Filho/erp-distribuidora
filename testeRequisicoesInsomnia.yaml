        text: "{\n  \"supplierId\": \"{{ _.supplier_id }}\",\n  \"country\": \"Brasil\",\n  \"state\": \"Pernambuco\",\n \
          \ \"city\": \"Caruaru\",\n  \"street\": \"Avenida Agamenon Magalhães\",\n  \"neighborhood\": \"Maurício de Nassau\"\
