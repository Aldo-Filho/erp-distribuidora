              modified: 1791678654231
              isPrivate: false
              description: "Filtra por fornecedor, produto, marca/categoria do produto, nome, código, custo, prazo, preferência e situação. supplierId está habilitado para listar os vínculos do fornecedor selecionado."
              sortKey: 100
            method: "GET"
            parameters:
              - name: "supplierId"
                value: "{{ _.supplier_id }}"
                disabled: false
              - name: "productId"
                value: "{{ _.product_id }}"
                disabled: true
              - name: "brandId"
                value: "{{ _.brand_id }}"
                disabled: true
              - name: "categoryId"
                value: "{{ _.category_id }}"
                disabled: true
              - name: "productName"
                value: "Exemplo"
                disabled: true
              - name: "supplierProductCode"
                value: "ABC"
                disabled: true
              - name: "minCost"
                value: "0"
                disabled: true
              - name: "maxCost"
                value: "1000"
                disabled: true
              - name: "avgDeliveryDays"
                value: "5"
                disabled: true
              - name: "preferred"
                value: "true"
                disabled: true
              - name: "active"
                value: "true"
                disabled: true
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/productSupplier/{{ _.supplier_product_id }}"
            name: "Buscar vínculo de produto por ID"
            meta:
              id: "req_10a1282c36fd7d51b5acecb400000002"
              created: 1791678654231
              modified: 1791678654231
              isPrivate: false
              description: "Use supplier_product_id, o ID retornado pelo cadastro do vínculo. Consulta inexistente retorna 204."
              sortKey: 200
            method: "GET"
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/productSupplier"
            name: "Vincular produto ao fornecedor"
            meta:
              id: "req_10a1282c36fd7d51b5acecb400000003"
              created: 1791678654231
              modified: 1791678654231
              isPrivate: false
              description: "Produto, fornecedor e custo são obrigatórios. O par produto/fornecedor é único. preferred assume false e active assume true quando omitidos. Copie o ID retornado para supplier_product_id."
              sortKey: 300
            method: "POST"
            body:
              mimeType: "application/json"
              text: |-
                {
                  "productId": "{{ _.product_id }}",
                  "supplierId": "{{ _.supplier_id }}",
                  "cost": 42.5,
                  "avgDeliveryDays": 5,
                  "supplierProductCode": "ABC-25",
                  "preferred": true,
                  "active": true
                }
            headers:
              - name: "Content-Type"
                value: "application/json"
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/productSupplier/{{ _.supplier_product_id }}"
            name: "Atualizar vínculo de produto (patch)"
            meta:
              id: "req_10a1282c36fd7d51b5acecb400000004"
              created: 1791678654231
              modified: 1791678654231
              isPrivate: false
              description: "Envie somente os campos desejados. Aceita productId, supplierId, cost, avgDeliveryDays, supplierProductCode, preferred e active; um novo par não pode duplicar um vínculo existente. false e zero são aplicados."
              sortKey: 400
            method: "PATCH"
            body:
              mimeType: "application/json"
              text: |-
                {
                  "cost": 45,
                  "avgDeliveryDays": 7,
                  "supplierProductCode": "ABC-25-ATUALIZADO",
                  "preferred": false,
                  "active": true
                }
            headers:
              - name: "Content-Type"
                value: "application/json"
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/productSupplier/{{ _.supplier_product_id }}"
            name: "Remover vínculo de produto"
            meta:
              id: "req_10a1282c36fd7d51b5acecb400000005"
              created: 1791678654231
              modified: 1791678654231
              isPrivate: false
              description: "Remove apenas o vínculo e seus dados comerciais, preservando o produto e o fornecedor. Use supplier_product_id."
              sortKey: 500
            method: "DELETE"
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
