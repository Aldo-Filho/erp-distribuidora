          created: 1791427699214
          modified: 1791427699214
          sortKey: 600
          description: "Cadastre endereços junto com o fornecedor ou separadamente. Um fornecedor pode ter vários endereços. Os IDs de fornecedor e endereço são independentes."
        children:
          - url: "{{ _.base_url }}/supplierAddress/search"
            name: "Buscar endereços de fornecedores (filtros)"
            meta:
              id: "req_fd6bc20188ed46ea9b72f61b50d811d9"
              created: 1791427699214
              modified: 1791427699214
              isPrivate: false
              description: "Todos os filtros são opcionais. Para localizar o endereço criado junto com o fornecedor, habilite supplierId. Copie o ID do endereço para supplier_address_id no ambiente."
              sortKey: 100
            method: "GET"
            parameters:
              - name: "supplierId"
                value: "{{ _.supplier_id }}"
                disabled: true
              - name: "addressType"
                value: "MAIN"
                disabled: true
              - name: "country"
                value: "Brasil"
                disabled: true
              - name: "state"
                value: "Pernambuco"
                disabled: true
              - name: "city"
                value: "Caruaru"
                disabled: true
              - name: "street"
                value: "Agamenon"
                disabled: true
              - name: "neighborhood"
                value: "Nassau"
                disabled: true
              - name: "number"
                value: "1200"
                disabled: true
              - name: "complement"
                value: "Sala"
                disabled: true
              - name: "zipCode"
                value: "55012-290"
                disabled: true
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/supplierAddress/{{ _.supplier_address_id }}"
            name: "Buscar endereço de fornecedor por ID"
            meta:
              id: "req_3621528499804dbca5f02723d978da49"
              created: 1791427699214
              modified: 1791427699214
              isPrivate: false
              description: "Use o ID do endereço, que pode ser diferente do ID do fornecedor. Retorna 204 quando não encontrado."
              sortKey: 200
            method: "GET"
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/supplierAddress"
            name: "Cadastrar endereço de fornecedor"
            meta:
              id: "req_eb6d0b7e9bbc4c3486822aa1a5452b38"
              created: 1791427699214
              modified: 1791427699214
              isPrivate: false
              description: "Defina supplier_id de um fornecedor existente. É possível cadastrar vários endereços. Duplicidade é verificada por fornecedor, tipo, CEP, número e complemento. Copie o ID retornado para supplier_address_id."
              sortKey: 300
            method: "POST"
            body:
              mimeType: "application/json"
              text: |-
                {
                  "supplierId": "{{ _.supplier_id }}",
                  "country": "Brasil",
                  "state": "Pernambuco",
                  "city": "Caruaru",
                  "street": "Avenida Agamenon Magalhães",
                  "neighborhood": "Maurício de Nassau",
                  "number": "1250",
                  "complement": "Sala 02",
                  "zipCode": "55012-290",
                  "addressType": "MAIN"
                }
            headers:
              - name: "Content-Type"
                value: "application/json"
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/supplierAddress/{{ _.supplier_address_id }}"
            name: "Atualizar endereço de fornecedor (patch)"
            meta:
              id: "req_4c8c95148b4a4b19a9cfc582863c664b"
              created: 1791427699214
              modified: 1791427699214
              isPrivate: false
              description: "Envie apenas os campos que deseja alterar. Uma string vazia em complement limpa o complemento. Não envie supplierId; o vínculo com o fornecedor é preservado."
              sortKey: 400
            method: "PATCH"
            body:
              mimeType: "application/json"
              text: |-
                {
                  "neighborhood": "Centro",
                  "number": "1300",
                  "complement": "Sala 03",
                  "addressType": "BILLING"
                }
            headers:
              - name: "Content-Type"
                value: "application/json"
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
              rebuildPath: true
          - url: "{{ _.base_url }}/supplierAddress/{{ _.supplier_address_id }}"
            name: "Remover endereço de fornecedor"
            meta:
              id: "req_c17a077b5f47454ca617adf3ef66a982"
              created: 1791427699214
              modified: 1791427699214
              isPrivate: false
              description: "Remove apenas o endereço e desfaz o vínculo com o fornecedor. Defina supplier_address_id no ambiente."
              sortKey: 500
            method: "DELETE"
            settings:
              renderRequestBody: true
              encodeUrl: true
              followRedirects: "global"
              cookies:
                send: true
                store: true
