        value: '0'
        disabled: true
      - name: maxCost
        value: '1000'
        disabled: true
      - name: avgDeliveryDays
        value: '5'
        disabled: true
      - name: preferred
        value: 'true'
        disabled: true
      - name: active
        value: 'true'
        disabled: true
